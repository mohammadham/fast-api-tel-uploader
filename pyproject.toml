[project]
name = "telegramdrive"
version = "1.0.0"
description = "Professional upload/download service backed by Telegram (MTProto accounts + Bot) with priority queue, streaming and web panel"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "telethon>=1.36,<2.0",
  "aiogram>=3.13,<4.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "cryptography>=43.0",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "asgi-lifespan>=2.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
