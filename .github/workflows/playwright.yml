name: CI — backend pytest + panel e2e

# Runs on every push: the full backend test suite (pinned to the project .venv)
# and the Playwright panel smoke tests. The e2e backend is the project's own
# FastAPI app in fake-TG mode, started by playwright.config.mjs itself — no
# separate service/container needed.
#
# Interpreter pinning: pytest ALWAYS runs through .venv/bin/python after
# installing the complete requirements.txt into .venv, and a preflight step
# fails loudly if that interpreter is missing any runtime dependency — an
# interpreter without telethon/python_socks used to surface as two cryptic
# test_proxies.py assertion failures instead of a clear "missing dependency".

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # weekly run

env:
  PYTHON_VERSION: "3.12"

jobs:
  pytest:
    name: backend tests (pinned .venv)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create project venv (.venv)
        run: python -m venv .venv

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}

      - name: Install full dependency manifest into .venv
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Preflight — .venv interpreter must have every runtime dep
        run: |
          .venv/bin/python - <<'PY'
          import importlib, sys
          mods = ("fastapi", "uvicorn", "aiosqlite", "sqlalchemy", "telethon",
                  "python_socks", "aiogram", "pydantic_settings", "jwt",
                  "multipart", "qrcode", "asgi_lifespan", "pytest",
                  "pytest_asyncio")
          missing = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except ImportError:
                  missing.append(m)
          if missing:
              sys.exit("FAIL: %s is missing: %s — install the full requirements.txt into .venv"
                       % (sys.executable, ", ".join(missing)))
          print("preflight OK:", sys.executable)
          PY

      - name: Run backend test suite (pinned to .venv)
        run: .venv/bin/python -m pytest

  e2e:
    name: panel e2e (Playwright, real backend in fake-TG mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create project venv (.venv)
        run: python -m venv .venv

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}

      - name: Install full dependency manifest into .venv
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Preflight — .venv interpreter must have every runtime dep
        run: |
          .venv/bin/python - <<'PY'
          import importlib, sys
          mods = ("fastapi", "uvicorn", "aiosqlite", "sqlalchemy", "telethon",
                  "python_socks", "aiogram", "pydantic_settings", "jwt",
                  "multipart", "qrcode", "asgi_lifespan", "pytest",
                  "pytest_asyncio")
          missing = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except ImportError:
                  missing.append(m)
          if missing:
              sys.exit("FAIL: %s is missing: %s — install the full requirements.txt into .venv"
                       % (sys.executable, ", ".join(missing)))
          print("preflight OK:", sys.executable)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm  # root package-lock.json (@playwright/test)

      - name: Install e2e deps (@playwright/test)
        run: npm ci --no-fund --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install panel deps
        working-directory: panel
        run: npm ci --no-fund --no-audit

      - name: Build panel (test the real source, not a stale committed static/)
        working-directory: panel
        run: npm run build

      - name: Run Playwright e2e suite
        run: npx playwright test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy:
    name: deploy to production server
    needs: [pytest, e2e]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The production host changed from the old server. Keep it configurable
      # so a future move only needs this repository variable updated.
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '135.125.208.195' }}
      PUBLIC_URL: ${{ vars.TDRIVE_PUBLIC_URL || 'https://tdrive.sanduqche.top/' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          # Strip CR characters from a secret pasted on Windows; a CRLF PEM
          # otherwise fails with "error in libcrypto".
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload source archive
        run: |
          git archive -o /tmp/tdrive-src.tgz HEAD
          scp -i ~/.ssh/deploy_key /tmp/tdrive-src.tgz root@"$DEPLOY_HOST":/tmp/tdrive-src.tgz

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" "bash -s" <<'REMOTE'
            set -euo pipefail
            rm -rf /tmp/tdrive-stage
            mkdir -p /tmp/tdrive-stage
            tar xzf /tmp/tdrive-src.tgz -C /tmp/tdrive-stage

            # /opt/tdrive owns server-specific docker-compose.yml and
            # docker-compose.override.yml (loopback port + 1panel network).
            # Only replace the application build inputs, and never .env, data,
            # .git or the compose files.
            rsync -a /tmp/tdrive-stage/app/ /opt/tdrive/app/
            rsync -a /tmp/tdrive-stage/static/ /opt/tdrive/static/
            rsync -a /tmp/tdrive-stage/scripts/ /opt/tdrive/scripts/
            cp /tmp/tdrive-stage/Dockerfile /opt/tdrive/Dockerfile
            cp /tmp/tdrive-stage/requirements.txt /opt/tdrive/requirements.txt

            rm -rf /tmp/tdrive-stage /tmp/tdrive-src.tgz
            cd /opt/tdrive
            docker compose -f docker-compose.yml -f docker-compose.override.yml build app
            docker compose -f docker-compose.yml -f docker-compose.override.yml up -d app

            CID=$(docker compose -f docker-compose.yml -f docker-compose.override.yml ps -q app)
            if [ -z "$CID" ]; then
              echo "app container was not created"
              exit 1
            fi

            CODE=000
            for i in $(seq 1 45); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8000/api/v1/admin/readyz || true)
              [ "$CODE" = "200" ] && break
              sleep 2
            done
            echo "Local readyz: $CODE"
            if [ "$CODE" != "200" ]; then
              docker logs "$CID" --tail 80
              exit 1
            fi
          REMOTE

      - name: Public smoke check
        run: |
          CODE=$(curl -s -o /dev/null -w %{http_code} --max-time 30 "$PUBLIC_URL")
          echo "Public health: $CODE"
          test "$CODE" = "200"
