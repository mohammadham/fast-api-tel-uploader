name: Panel Parity Guard

on:
  push:
    branches: [main, develop, master]
    paths: ['static/**']
  pull_request:
    paths: ['static/**']

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: app.js syntax check
        run: node --check static/app.js
      - name: index.html is Vue-template safe (no raw backticks/template-literals in markup)
        run: |
          ! grep -nE '\$\{' static/index.html || {
            echo "::error::static/index.html contains \${...} — Vue template delimiters conflict with JS template literals. Move JS into app.js."
            exit 1
          }
      - name: panel files referenced consistently
        run: |
          grep -q 'src="/static/app.js"' static/index.html
          grep -q 'id="app"' static/index.html
