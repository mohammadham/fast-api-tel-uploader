name: Panel Parity Guard

on:
  push:
    branches: [main, develop, master]
    paths: ['panel/**', 'static/**']
  pull_request:
    paths: ['panel/**', 'static/**']

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Install panel deps
        working-directory: panel
        run: npm ci --no-fund --no-audit
      - name: Build panel (Vite)
        working-directory: panel
        run: npm run build
      - name: Built index references hashed assets
        run: |
          grep -q 'static/assets/index-' static/index.html
          grep -q 'id="app"' static/index.html
      - name: No legacy runtime references left in served files
        run: |
          ! grep -rn 'vendor/vue' static/index.html
          ! grep -rn '/static/app.js' static/index.html
      - name: No template-literal delimiters in SFC templates
        run: |
          ! grep -nE '\$\{' panel/src/App.vue || {
            echo "::error::panel/src/App.vue contains \${...} — Vue delimiters conflict with JS template literals. Move JS into the script block."
            exit 1
          }
